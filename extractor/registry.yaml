# Registro central de normas de la biblioteca.
#
# normas: cada entrada es una norma convertida (o por convertir con
#   `normas-cli todas`). Campos:
#     id        id de Función Pública (norma.php?i=<id>)
#     tipo, numero, anio   identidad («Ley 1564 de 2012»)
#     sigla     etiqueta corta usada en los nombres de nota (art. 22 CGP)
#     nombre    nombre largo («Código General del Proceso»)
#     ruta      carpeta dentro de biblioteca/
#     estado    vigente | derogada (informativo; se copia al frontmatter)
#     jerarquia (opcional) orden forzado de niveles, de mayor a menor
#     alias_siglas (opcional) otras siglas por las que se cita (alias en las notas)
#     fuente/url (opcional) `senado` para normas que el DAFP no publica
#     esquema   (opcional) niveles a insertar antes de ciertos artículos, para
#               páginas del DAFP sin encabezados fiables (la Constitución).
# codigos: diccionario «nombre del código» → sigla, para resolver referencias
#   como «del Código de Comercio» en el texto. Se compara sin tildes ni
#   mayúsculas, y gana la coincidencia más larga.
