name: Release del plugin

# Publica un release al empujar un tag con la versión exacta del manifest
# (sin «v»), p. ej.:  git tag 0.2.0 && git push origin 0.2.0
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin-obsidian/package-lock.json
      - name: Comprobar que el tag coincide con manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$version" != "${GITHUB_REF_NAME}" ]; then
            echo "El tag ${GITHUB_REF_NAME} no coincide con manifest.json ($version)"; exit 1
          fi
      - name: Compilar
        working-directory: plugin-obsidian
        run: |
          npm ci
          npm run build
          npm test
      - name: Crear el release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            plugin-obsidian/main.js manifest.json \
            --title "${GITHUB_REF_NAME}" \
            --notes "Plugin Normas Colombianas ${GITHUB_REF_NAME}. Instrucciones en el README."
