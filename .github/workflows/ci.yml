name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extractor:
    name: Extractor (pytest + verificar)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: extractor/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Verificar la biblioteca publicada
        run: normas-cli verificar ../biblioteca

  plugin:
    name: Plugin (build + prueba de humo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin-obsidian
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plugin-obsidian/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
